<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowA" cx="78%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#22E07C" stop-opacity="0.34"/>
      <stop offset="38%" stop-color="#0FD36A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050B08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="78%" r="48%">
      <stop offset="0%" stop-color="#0B3D26" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#07281A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050B08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="60%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#3BFF9E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#050B08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22E07C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22E07C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22E07C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#050B08" stop-opacity="0"/>
      <stop offset="72%" stop-color="#030704" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020503" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123526" stop-opacity="0"/>
      <stop offset="45%" stop-color="#123526" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1B4A33" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#050B08"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowC)"/>

  <!-- perspective grid floor, right side -->
  <g stroke="url(#floorFade)" stroke-width="1.4" opacity="0.5">
    <line x1="1460" y1="640" x2="540" y2="1080"/>
    <line x1="1460" y1="640" x2="820" y2="1080"/>
    <line x1="1460" y1="640" x2="1080" y2="1080"/>
    <line x1="1460" y1="640" x2="1320" y2="1080"/>
    <line x1="1460" y1="640" x2="1560" y2="1080"/>
    <line x1="1460" y1="640" x2="1800" y2="1080"/>
    <line x1="1460" y1="640" x2="2060" y2="1080"/>
    <line x1="1460" y1="640" x2="2340" y2="1080"/>
  </g>
  <g stroke="#1B4A33" stroke-width="1.2">
    <line x1="700" y1="1005" x2="2200" y2="1005" opacity="0.5"/>
    <line x1="850" y1="925" x2="2150" y2="925" opacity="0.42"/>
    <line x1="965" y1="862" x2="2100" y2="862" opacity="0.34"/>
    <line x1="1055" y1="812" x2="2060" y2="812" opacity="0.27"/>
    <line x1="1130" y1="772" x2="2020" y2="772" opacity="0.2"/>
    <line x1="1195" y1="738" x2="1990" y2="738" opacity="0.15"/>
    <line x1="1250" y1="710" x2="1960" y2="710" opacity="0.1"/>
  </g>

  <!-- light streaks -->
  <rect x="1050" y="-140" width="150" height="900" fill="url(#streak)" transform="rotate(24 1125 310)" filter="url(#soft)"/>
  <rect x="1420" y="-100" width="90" height="820" fill="url(#streak)" transform="rotate(24 1465 310)" filter="url(#soft)" opacity="0.7"/>

  <!-- floating glass panels -->
  <g opacity="0.55">
    <rect x="1210" y="220" width="86" height="56" rx="10" fill="#0E1A15" stroke="#2A5B41" stroke-width="1.4" transform="rotate(-12 1253 248)"/>
    <rect x="1600" y="150" width="64" height="42" rx="9" fill="#0E1A15" stroke="#2A5B41" stroke-width="1.2" transform="rotate(9 1632 171)"/>
    <rect x="1740" y="420" width="96" height="62" rx="11" fill="#0E1A15" stroke="#2A5B41" stroke-width="1.4" transform="rotate(-7 1788 451)"/>
    <rect x="1420" y="520" width="52" height="36" rx="8" fill="#0E1A15" stroke="#22523A" stroke-width="1.1" transform="rotate(14 1446 538)"/>
  </g>

  <!-- particles -->
  <g fill="#3BFF9E">
    <circle cx="1180" cy="180" r="2.6" opacity="0.7" filter="url(#soft2)"/>
    <circle cx="1330" cy="120" r="1.8" opacity="0.5"/>
    <circle cx="1520" cy="260" r="3.2" opacity="0.6" filter="url(#soft2)"/>
    <circle cx="1680" cy="330" r="1.6" opacity="0.45"/>
    <circle cx="1820" cy="210" r="2.4" opacity="0.65" filter="url(#soft2)"/>
    <circle cx="1080" cy="360" r="1.7" opacity="0.4"/>
    <circle cx="1440" cy="420" r="2.2" opacity="0.55"/>
    <circle cx="1760" cy="560" r="2.8" opacity="0.5" filter="url(#soft2)"/>
    <circle cx="1600" cy="640" r="1.6" opacity="0.4"/>
    <circle cx="1260" cy="560" r="2" opacity="0.45"/>
    <circle cx="990" cy="240" r="1.5" opacity="0.3"/>
    <circle cx="1880" cy="480" r="1.9" opacity="0.5"/>
    <circle cx="900" cy="520" r="1.4" opacity="0.22"/>
    <circle cx="1540" cy="80" r="1.6" opacity="0.45"/>
    <circle cx="1120" cy="680" r="1.8" opacity="0.3"/>
  </g>

  <!-- faint far-left keep-dark wash + vignette -->
  <rect width="1100" height="1080" fill="#040A07" opacity="0.55"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
